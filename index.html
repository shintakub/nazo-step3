<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>謎解き｜解答画面</title>
<style>
  :root { color-scheme: dark; --bg:#111827; --card:#1f2937; --line:#374151; --text:#f9fafb; --muted:#9ca3af; --accent:#60a5fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .app { max-width:900px; margin:auto; padding:16px; }
  header { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:14px; }
  h1 { font-size:26px; margin:0; line-height:1.2; }
  .role { font-size:12px; color:var(--muted); padding:6px 10px; border:1px solid var(--line); border-radius:999px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; }
  .title { font-weight:700; margin-bottom:8px; }
  .image-box { aspect-ratio:3/4; background:#0b1220; border-radius:10px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .image-box img { width:100%; height:100%; object-fit:contain; display:none; }
  .placeholder { color:var(--muted); text-align:center; font-size:14px; }
  .controls { margin-top:14px; display:grid; gap:10px; }
  button, .action-button { width:100%; min-height:58px; border:0; border-radius:12px; padding:16px; font-size:17px; font-weight:800; cursor:pointer; touch-action:manipulation; }
  .action-button { display:block; text-align:center; user-select:none; -webkit-user-select:none; }
  .shootA, .shootB { min-height:58px; background:#2563eb; color:white; }
  .shootB { background:#7c3aed; color:white; }
  .visually-hidden { clip:rect(0 0 0 0); clip-path:inset(50%); height:1px; overflow:hidden; position:absolute; white-space:nowrap; width:1px; }
    .correct { background:#16a34a; color:white; }
  .wrong { background:#dc2626; color:white; }
  .status { display:none; }
  .error { color:#fca5a5; }
  .ok { color:#86efac; }
  input[type=file] { display:none; }
  .setup { background:#0f172a; border:1px solid var(--line); padding:14px; border-radius:14px; margin-bottom:14px; }
  .setup summary { cursor:pointer; font-weight:700; }
  .setup p { color:var(--muted); font-size:13px; line-height:1.6; }
  textarea { width:100%; min-height:150px; margin-top:10px; background:#111827; color:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; font-family:ui-monospace,monospace; }
  .small { padding:10px 12px; font-size:14px; background:#374151; color:white; }
  .hidden { display:none !important; }
  @media (max-width:640px) { .app{padding:10px}.grid{gap:8px}.panel{padding:8px}.title{font-size:15px}.controls{margin-top:10px}button,.action-button{padding:14px;font-size:16px;min-height:58px} }

  /* 撮影ボタンを大きく、視認性の高い主ボタンにします */
  #playerControls {
    margin-top: 18px;
  }

  #shootBtn {
    min-height: 72px;
    width: 100%;
    border-radius: 18px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.08em;
    box-shadow: 0 5px 0 rgba(0,0,0,0.22), 0 10px 24px rgba(0,0,0,0.20);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  #shootBtn::before {
    content: "📷 ";
  }

  #shootBtn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.22), 0 4px 12px rgba(0,0,0,0.18);
  }

  /* GMの正誤ボタン */
  #gmControls {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    width: 100%;
  }

  #gmControls button {
    width: 100%;
    min-width: 0;
    min-height: 68px;
    padding: 12px 8px;
    font-size: 18px;
    white-space: nowrap;
  }

  @media (max-width: 480px) {
    /* スマホでは絶対に縦積みにせず、2列を維持 */
    #gmControls {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #gmControls button {
      min-height: 64px;
      font-size: 17px;
    }

    #shootBtn {
      min-height: 70px;
      font-size: 21px;
    }
  }


  /* A/B共通の撮影ボタン */
  #shootBtn {
    background: #facc15 !important;
    color: #111827 !important;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 0 auto;
    border: 2px solid #fde68a;
  }

  #shootBtn::before {
    content: "📷";
    margin-right: 10px;
    font-size: 1.15em;
    line-height: 1;
  }

  h1 {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.03em;
  }

</style>
</head>
<body>
<div class="app">
  <header>
    <h1>解答画面</h1>
    <div id="roleLabel" class="role">役割: 未設定</div>
  </header>
<div class="grid">
    <section class="panel">
      <div class="title">ルーム1</div>
      <div class="image-box">
        <img id="imgA" alt="ルーム1">
        <div id="placeholderA" class="placeholder">イラスト1</div>
      </div>
    </section>
    <section class="panel">
      <div class="title">ルーム2</div>
      <div class="image-box">
        <img id="imgB" alt="ルーム2">
        <div id="placeholderB" class="placeholder">イラスト2</div>
      </div>
    </section>
  </div>

  <div id="playerControls" class="controls hidden">
    <!-- labelからfile inputを起動します。スマホのカメラ/写真選択画面を開きやすい方式です。 -->
    <label id="shootBtn" class="action-button" for="cameraInput">撮影</label>
    <input id="cameraInput" class="visually-hidden" type="file" accept="image/*" capture="environment">
  </div>

  <div id="gmControls" class="controls hidden">
    <button id="correctBtn" class="correct">〇 正解</button>
    <button id="wrongBtn" class="wrong">✕ 不正解</button>
  </div>

  <div id="status" class="status">接続準備中…</div>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const ROLE_PARAM = new URLSearchParams(location.search).get("role") || "";
const GM_KEY = "gm_secret123";

// URLのroleから4種類の役割を決定します。
// ?role=gm            → GM
// ?role=room1         → ルーム1
// ?role=room2         → ルーム2
// ?role=display       → 表示
// 旧URLにも互換対応します。
// ?role=gm_secret123  → GM
// ?role=a             → ルーム1
// ?role=b             → ルーム2
// role未指定         → 表示
const ROLE =
  ROLE_PARAM === "gm" || ROLE_PARAM === GM_KEY
    ? "gm"
    : ROLE_PARAM === "room1" || ROLE_PARAM === "a"
      ? "room1"
      : ROLE_PARAM === "room2" || ROLE_PARAM === "b"
        ? "room2"
        : "display";

// GMと表示だけ判定音を鳴らします。
const canPlayJudgeSound = ROLE === "gm" || ROLE === "display";

function playJudgeSound(action) {
  if (!canPlayJudgeSound) return;

  const sound = action === "correct" ? correctSound : wrongSound;

  // 同じ音を連続して鳴らせるように先頭へ戻します。
  sound.currentTime = 0;

  sound.play().catch((error) => {
    console.error("効果音の再生に失敗しました:", error);
  });
}

// Firebaseの接続設定
// Webアプリ登録時にFirebaseから取得した値を埋め込んでいます。
// databaseURLだけはRealtime Database作成後のURLを指定してください。
const firebaseConfig = {
  apiKey: "AIzaSyA423n1jbHWmpQfxqaq70MCW9jHxkPzw6Q",
  authDomain: "nazo-step3.firebaseapp.com",
  databaseURL: "https://nazo-step3-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "nazo-step3",
  storageBucket: "nazo-step3.firebasestorage.app",
  messagingSenderId: "659251093229",
  appId: "1:659251093229:web:f83ad1517860538b44f6e4"
};

let lastPlayedActionId = 0;

function setStatus(msg, cls="") {
  statusEl.textContent = msg;
  statusEl.className = "status " + cls;
}

function applyRoleUI() {
  // 4種類の役割ごとに表示するUIを決めます。
  if (ROLE === "room1") {
    roleLabel.textContent = "ルーム1";
    playerControls.classList.remove("hidden");
    $("shootBtn").className = "shootA";
  } else if (ROLE === "room2") {
    roleLabel.textContent = "ルーム2";
    playerControls.classList.remove("hidden");
    $("shootBtn").className = "shootB";
  } else if (ROLE === "gm") {
    roleLabel.textContent = "GM";
    gmControls.classList.remove("hidden");
  } else {
    roleLabel.textContent = "表示";
  }
}


// 表示画面など、Firebase受信後に再生する端末でブラウザの音声準備を行います。
// これは音を鳴らさず、ブラウザ側に音声要素を認識させるだけです。
document.addEventListener("pointerdown", () => {
  correctSound.load();
  wrongSound.load();
}, { once: true });

function renderArea(area, dataUrl) {
  const img = $(area === "a" ? "imgA" : "imgB");
  const ph = $(area === "a" ? "placeholderA" : "placeholderB");
  if (dataUrl) {
    img.src = dataUrl;
    img.style.display = "block";
    ph.style.display = "none";
  } else {
    img.removeAttribute("src");
    img.style.display = "none";
    ph.style.display = "block";
  }
}


function resizeAndCompress(file, maxWidth = 800, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let width = img.naturalWidth;
        let height = img.naturalHeight;
        if (width > maxWidth) {
          height = Math.round(height * maxWidth / width);
          width = maxWidth;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d", { alpha: false });
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}


async function connectFirebase() {
  try {
    if (!firebaseConfig.databaseURL || firebaseConfig.databaseURL.includes("ここにRealtime")) {
      setStatus("Firebase設定: databaseURLが未設定です。", "error");
      return;
    }

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    db = getDatabase(app, firebaseConfig.databaseURL);
    const rootRef = ref(db, sessionPath);

    onValue(rootRef, (snap) => {
      const data = snap.val() || {};
      renderArea("a", data.room1 || null);
      renderArea("b", data.room2 || null);

      // 判定イベントを全端末で検知し、同じ判定音を再生します。
      if (data.actionId && data.actionId !== lastPlayedActionId) {
        lastPlayedActionId = data.actionId;
        if (data.lastAction === "correct") playJudgeSound("correct");
        if (data.lastAction === "wrong") playJudgeSound("wrong");
      }
      setStatus("");
    }, (err) => {
      console.error(err);
      console.error("Firebase接続エラー:", err);
    });
  } catch (e) {
    console.error(e);
    console.error("Firebase接続エラー:", e);
  }
}

// 撮影後に選択された画像を圧縮してFirebaseへ送信します。
cameraInput.addEventListener("change", async () => {
  const file = cameraInput.files?.[0];

  // 「撮影をキャンセル」した場合は何もしません。
  if (!file) return;

  // ルーム1/2以外では撮影データを送信しません。
  if (ROLE !== "room1" && ROLE !== "room2") return;

  if (!db) {
    setStatus("Firebaseに接続できていません。", "error");
    cameraInput.value = "";
    return;
  }

  try {
    setStatus("写真を圧縮しています…");

    // スマホ写真を横幅800px・JPEGへ変換して容量を小さくします。
    const dataUrl = await resizeAndCompress(file, 800, 0.72);

    setStatus("写真をFirebaseへ送信しています…");

    // 圧縮後画像のサイズを確認します。
    const byteSize = Math.round((dataUrl.length * 3) / 4);
    console.log("圧縮後画像サイズ:", Math.round(byteSize / 1024) + " KB");

    const room = ROLE === "room1" ? "room1" : "room2";

    // 画像と更新時刻を一度の更新で書き込みます。
    await update(ref(db, sessionPath), {
      [room]: dataUrl,
      updatedAt: Date.now()
    });

    setStatus("送信完了", "ok");
  } catch (e) {
    console.error("画像送信エラー:", e);

    // Firebaseの権限エラーなども画面に表示します。
    const message = e?.message || String(e);
    setStatus("写真の送信に失敗しました: " + message, "error");
  } finally {
    // 同じ写真をもう一度選択できるようにします。
    cameraInput.value = "";
  }
});

// GMの正解・不正解ボタン。
$("correctBtn").addEventListener("click", async () => {
  await judge("correct");
});

$("wrongBtn").addEventListener("click", async () => {
  await judge("wrong");
});

async function judge(action) {
  if (!db) {
    setStatus("Firebaseに接続できていません。", "error");
    return;
  }

  try {
    setStatus(action === "correct" ? "正解を送信しています…" : "不正解を送信しています…");

    // 判定イベントは全端末へ送信します。画像を消すのは正解の場合だけです。
    const updates = {
      lastAction: action,
      actionId: Date.now(),
      updatedAt: Date.now()
    };

    if (action === "correct") {
      updates.room1 = null;
      updates.room2 = null;
    }

    await update(ref(db, sessionPath), updates);

    setStatus(action === "correct"
      ? "正解を送信しました。画像をクリアしました。"
      : "不正解を送信しました。画像はそのままです。", "ok");
  } catch (e) {
    console.error("判定送信エラー:", e);
    const message = e?.message || String(e);
    setStatus("判定の送信に失敗しました: " + message, "error");
  }
}

applyRoleUI();
connectFirebase();
</script>
</body>
</html>
