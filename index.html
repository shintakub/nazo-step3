<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>謎解き｜リアルタイム画像共有</title>
<style>
  :root { color-scheme: dark; --bg:#111827; --card:#1f2937; --line:#374151; --text:#f9fafb; --muted:#9ca3af; --accent:#60a5fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .app { max-width:900px; margin:auto; padding:16px; }
  header { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:14px; }
  h1 { font-size:20px; margin:0; }
  .role { font-size:12px; color:var(--muted); padding:6px 10px; border:1px solid var(--line); border-radius:999px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; }
  .title { font-weight:700; margin-bottom:8px; }
  .image-box { aspect-ratio:4/3; background:#0b1220; border-radius:10px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .image-box img { width:100%; height:100%; object-fit:contain; display:none; }
  .placeholder { color:var(--muted); text-align:center; font-size:14px; }
  .controls { margin-top:14px; display:grid; gap:10px; }
  button { border:0; border-radius:12px; padding:16px; font-size:17px; font-weight:800; cursor:pointer; touch-action:manipulation; }
  .shootA { background:#2563eb; color:white; }
  .shootB { background:#7c3aed; color:white; }
  .correct { background:#16a34a; color:white; }
  .wrong { background:#dc2626; color:white; }
  .status { margin-top:12px; min-height:24px; color:var(--muted); font-size:13px; }
  .error { color:#fca5a5; }
  .ok { color:#86efac; }
  input[type=file] { display:none; }
  .setup { background:#0f172a; border:1px solid var(--line); padding:14px; border-radius:14px; margin-bottom:14px; }
  .setup summary { cursor:pointer; font-weight:700; }
  .setup p { color:var(--muted); font-size:13px; line-height:1.6; }
  textarea { width:100%; min-height:150px; margin-top:10px; background:#111827; color:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; font-family:ui-monospace,monospace; }
  .small { padding:10px 12px; font-size:14px; background:#374151; color:white; }
  .hidden { display:none !important; }
  @media (max-width:640px) { .app{padding:10px}.grid{gap:8px}.panel{padding:8px}.title{font-size:15px}.controls{margin-top:10px}button{padding:14px;font-size:16px} }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>リアルタイム画像共有</h1>
    <div id="roleLabel" class="role">役割: 未設定</div>
  </header>
<div class="grid">
    <section class="panel">
      <div class="title">ルーム1</div>
      <div class="image-box">
        <img id="imgA" alt="ルーム1">
        <div id="placeholderA" class="placeholder">画像なし</div>
      </div>
    </section>
    <section class="panel">
      <div class="title">ルーム2</div>
      <div class="image-box">
        <img id="imgB" alt="ルーム2">
        <div id="placeholderB" class="placeholder">画像なし</div>
      </div>
    </section>
  </div>

  <div id="playerControls" class="controls hidden">
    <button id="shootBtn">撮影する</button>
    <input id="cameraInput" type="file" accept="image/*" capture="environment">
  </div>

  <div id="gmControls" class="controls hidden">
    <button id="correctBtn" class="correct">〇 正解</button>
    <button id="wrongBtn" class="wrong">✕ 不正解</button>
  </div>

  <div id="status" class="status">接続準備中…</div>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const ROLE_PARAM = new URLSearchParams(location.search).get("role") || "";
const GM_KEY = "gm_secret123";


const $ = (id) => document.getElementById(id);
const statusEl = $("status");
const roleLabel = $("roleLabel");
const playerControls = $("playerControls");
const gmControls = $("gmControls");
const cameraInput = $("cameraInput");

let db = null;
let sessionPath = "puzzle/current";
// Firebaseの接続設定
// Webアプリ登録時にFirebaseから取得した値を埋め込んでいます。
// databaseURLだけはRealtime Database作成後のURLを指定してください。
const firebaseConfig = {
  apiKey: "AIzaSyA423n1jbHWmpQfxqaq70MCW9jHxkPzw6Q",
  authDomain: "nazo-step3.firebaseapp.com",
  databaseURL: "https://nazo-step3-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "nazo-step3",
  storageBucket: "nazo-step3.firebasestorage.app",
  messagingSenderId: "659251093229",
  appId: "1:659251093229:web:f83ad1517860538b44f6e4"
};

let lastPlayedActionId = 0;

function setStatus(msg, cls="") {
  statusEl.textContent = msg;
  statusEl.className = "status " + cls;
}

function applyRoleUI() {
  if (ROLE_PARAM === "a") {
    roleLabel.textContent = "役割: プレイヤーA";
    playerControls.classList.remove("hidden");
    $("shootBtn").className = "shootA";
  } else if (ROLE_PARAM === "b") {
    roleLabel.textContent = "役割: プレイヤーB";
    playerControls.classList.remove("hidden");
    $("shootBtn").className = "shootB";
  } else if (ROLE_PARAM === GM_KEY) {
    roleLabel.textContent = "役割: GM";
    gmControls.classList.remove("hidden");
  } else {
    roleLabel.textContent = "役割: 表示のみ";
  }
}

function renderArea(area, dataUrl) {
  const img = $(area === "a" ? "imgA" : "imgB");
  const ph = $(area === "a" ? "placeholderA" : "placeholderB");
  if (dataUrl) {
    img.src = dataUrl;
    img.style.display = "block";
    ph.style.display = "none";
  } else {
    img.removeAttribute("src");
    img.style.display = "none";
    ph.style.display = "block";
  }
}

function playTone(correct) {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return;
  const ctx = new AudioCtx();

  const gain = ctx.createGain();
  gain.connect(ctx.destination);
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (correct ? 0.55 : 0.75));

  const osc = ctx.createOscillator();
  osc.connect(gain);
  osc.type = "sine";
  osc.frequency.setValueAtTime(correct ? 880 : 180, ctx.currentTime);
  if (correct) {
    osc.frequency.setValueAtTime(1175, ctx.currentTime + 0.14);
  } else {
    osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 0.55);
  }
  osc.start();
  osc.stop(ctx.currentTime + (correct ? 0.56 : 0.76));

  setTimeout(() => ctx.close(), 900);
}

function resizeAndCompress(file, maxWidth = 800, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let width = img.naturalWidth;
        let height = img.naturalHeight;
        if (width > maxWidth) {
          height = Math.round(height * maxWidth / width);
          width = maxWidth;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d", { alpha: false });
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const savedConfig = localStorage.getItem("firebaseConfig");

async function connectFirebase() {
  try {
    if (!firebaseConfig.databaseURL || firebaseConfig.databaseURL.includes("ここにRealtime")) {
      setStatus("Firebase設定: databaseURLが未設定です。", "error");
      return;
    }

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    db = getDatabase(app, firebaseConfig.databaseURL);
    const rootRef = ref(db, sessionPath);

    onValue(rootRef, (snap) => {
      const data = snap.val() || {};
      renderArea("a", data.room1 || null);
      renderArea("b", data.room2 || null);

      // 判定イベントは actionId が変わったときだけ再生します。
      if (data.actionId && data.actionId !== lastPlayedActionId) {
        lastPlayedActionId = data.actionId;
        if (data.lastAction === "correct") playTone(true);
        if (data.lastAction === "wrong") playTone(false);
      }
      setStatus("Firebase接続中", "ok");
    }, (err) => {
      console.error(err);
      setStatus("Firebase接続エラー: " + err.message, "error");
    });
  } catch (e) {
    console.error(e);
    setStatus("Firebase接続エラー: " + e.message, "error");
  }
}

applyRoleUI();
connectFirebase();
</script>
</body>
</html>
